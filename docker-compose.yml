services:
    php:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: crm_php
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
        depends_on:
            - db

    nginx:
        image: nginx:alpine
        container_name: solko_nginx
        ports:
            - "8000:80"
        volumes:
            - .:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - php

    db:
        image: mysql:8.0
        container_name: solko_db
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: crm_test
            MYSQL_USER: solko
            MYSQL_PASSWORD: secret
        ports:
            - "3305:3306"
        volumes:
            - db_data:/var/lib/mysql

    composer:
        image: composer:latest
        container_name: solko_composer
        working_dir: /var/www/html
        volumes:
            - .:/var/www/html
        entrypoint: ["composer"]
        profiles: ["tools"]

volumes:
    db_data:
