name: Sync Labels

on:
    push:
        paths:
            - '.github/labels.yml'
            - '.github/workflows/sync-labels.yml'
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            issues: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Sync labels
              uses: crazy-max/ghaction-github-labeler@v6
              with:
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  yaml-file: .github/labels.yml
